<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecteur audio</title>
<style>
  :root {
    --bg: #FFFFFF; --text: #181C25; --muted: #647084; --border: #E6EAF0;
    --soft: #F4F6FB; --accent: #4F46E5; --accent-soft: #EEF2FF; --loop: #059669; --loop-soft: #ECFDF5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: var(--text);
    -webkit-user-select: none; user-select: none;
  }
  .shell {
    height: 100%; padding: 16px 18px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 22px; display: flex; flex-direction: column; gap: 12px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .track {
    font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }
  .pick-btn {
    height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--border);
    background: var(--soft); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .pick-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .timeline { display: flex; flex-direction: column; gap: 4px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; height: 6px; }
  .times { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .btn {
    height: 44px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: var(--soft); }
  .btn.primary { flex: 1; background: var(--accent); border-color: var(--accent); color: #FFFFFF; font-size: 15px; }
  .btn.primary:hover { background: #4338CA; }
  .btn.loop-on { background: var(--loop-soft); border-color: var(--loop); color: var(--loop); }
  .bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .speeds { display: flex; gap: 5px; }
  .chip {
    height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="track" id="trackName">Aucun fichier audio chargé</div>
    <button class="pick-btn" id="pickBtn">Ouvrir un audio…</button>
    <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac">
  </div>

  <div class="timeline">
    <input type="range" id="seek" min="0" max="1000" value="0" disabled>
    <div class="times">
      <span id="curTime">00:00</span>
      <span id="loopInfo" class="hint"></span>
      <span id="durTime">00:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="backBtn" title="Revenir 5 secondes en arrière">−5 s</button>
    <button class="btn primary" id="playBtn">Lecture</button>
    <button class="btn" id="fwdBtn" title="Avancer de 5 secondes">+5 s</button>
    <button class="btn" id="abBtn" title="Définir une boucle sur un passage (A → B)">Boucle A-B</button>
  </div>

  <div class="bottom">
    <span class="hint">Vitesse :</span>
    <div class="speeds" id="speeds">
      <button class="chip" data-rate="0.75">0,75×</button>
      <button class="chip" data-rate="0.9">0,9×</button>
      <button class="chip active" data-rate="1">1×</button>
      <button class="chip" data-rate="1.25">1,25×</button>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function () {
  "use strict";

  var audio = document.getElementById("audio");
  var fileInput = document.getElementById("fileInput");
  var trackName = document.getElementById("trackName");
  var seek = document.getElementById("seek");
  var curTime = document.getElementById("curTime");
  var durTime = document.getElementById("durTime");
  var loopInfo = document.getElementById("loopInfo");
  var playBtn = document.getElementById("playBtn");
  var abBtn = document.getElementById("abBtn");

  var objectUrl = null;
  var pointA = null;
  var pointB = null;

  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function updateLoopUI() {
    if (pointA === null) {
      abBtn.textContent = "Boucle A-B";
      abBtn.classList.remove("loop-on");
      loopInfo.textContent = "";
    } else if (pointB === null) {
      abBtn.textContent = "Fin B";
      abBtn.classList.add("loop-on");
      loopInfo.textContent = "Début A : " + fmt(pointA);
    } else {
      abBtn.textContent = "Stop A-B";
      abBtn.classList.add("loop-on");
      loopInfo.textContent = "Boucle " + fmt(pointA) + " → " + fmt(pointB);
    }
  }

  document.getElementById("pickBtn").addEventListener("click", function () { fileInput.click(); });

  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(f);
    audio.src = objectUrl;
    trackName.textContent = f.name;
    pointA = null; pointB = null;
    updateLoopUI();
    seek.disabled = false;
    audio.play().catch(function () {});
  });

  playBtn.addEventListener("click", function () {
    if (!audio.src) { fileInput.click(); return; }
    if (audio.paused) audio.play().catch(function () {});
    else audio.pause();
  });

  document.getElementById("backBtn").addEventListener("click", function () {
    if (!audio.src) return;
    audio.currentTime = Math.max(0, audio.currentTime - 5);
  });

  document.getElementById("fwdBtn").addEventListener("click", function () {
    if (!audio.src) return;
    audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
  });

  abBtn.addEventListener("click", function () {
    if (!audio.src) return;
    if (pointA === null) {
      pointA = audio.currentTime;
    } else if (pointB === null) {
      if (audio.currentTime > pointA + 0.5) {
        pointB = audio.currentTime;
        audio.currentTime = pointA;
      } else {
        pointA = null;
      }
    } else {
      pointA = null; pointB = null;
    }
    updateLoopUI();
  });

  seek.addEventListener("input", function () {
    if (!isFinite(audio.duration) || audio.duration <= 0) return;
    audio.currentTime = (Number(seek.value) / 1000) * audio.duration;
  });

  audio.addEventListener("loadedmetadata", function () {
    durTime.textContent = fmt(audio.duration);
    seek.disabled = false;
  });

  audio.addEventListener("timeupdate", function () {
    if (pointA !== null && pointB !== null && audio.currentTime >= pointB) {
      audio.currentTime = pointA;
    }
    curTime.textContent = fmt(audio.currentTime);
    if (isFinite(audio.duration) && audio.duration > 0) {
      seek.value = Math.round((audio.currentTime / audio.duration) * 1000);
    }
  });

  audio.addEventListener("play", function () { playBtn.textContent = "Pause"; });
  audio.addEventListener("pause", function () { playBtn.textContent = "Lecture"; });
  audio.addEventListener("ended", function () { playBtn.textContent = "Relire"; });

  var chips = document.querySelectorAll(".chip");
  for (var i = 0; i < chips.length; i++) {
    chips[i].addEventListener("click", function () {
      var r = Number(this.getAttribute("data-rate")) || 1;
      audio.playbackRate = r;
      for (var j = 0; j < chips.length; j++) chips[j].classList.remove("active");
      this.classList.add("active");
    });
  }
})();
</script>
</body>
</html>
