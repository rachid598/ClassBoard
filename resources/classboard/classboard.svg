<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="52%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="sheen" cx="22%" cy="16%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="strokeWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
  </defs>

  <!-- Fond squircle moderne -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#sheen)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"/>

  <!-- Cadre tableau subtil en filigrane -->
  <rect x="76" y="88" width="360" height="336" rx="64" fill="#FFFFFF" fill-opacity="0.09"/>

  <!-- Monogramme C géométrique lumineux (tableau ouvert) -->
  <path d="M 332 152
           A 124 124 0 1 0 332 360"
        fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round"/>

  <!-- Trait lumineux surligné tracé au stylet -->
  <path d="M 224 274 Q 266 250 308 274"
        fill="none" stroke="url(#strokeWave)" stroke-width="22" stroke-linecap="round"/>

  <!-- Stylet moderne incliné (pointe vers le trait) -->
  <g transform="translate(336 226) rotate(42)">
    <!-- Corps du stylet -->
    <rect x="-20" y="-82" width="40" height="114" rx="18" fill="url(#pen)"/>
    <!-- Bague blanche élégante -->
    <rect x="-20" y="-44" width="40" height="12" fill="#FFFFFF" fill-opacity="0.65"/>
    <!-- Pointe du stylet -->
    <path d="M -18 28 L 18 28 L 0 66 Z" fill="#FFFFFF"/>
    <path d="M -7 51 L 7 51 L 0 66 Z" fill="#38BDF8"/>
  </g>

  <!-- Petite étincelle pédagogique en haut à droite -->
  <path d="M 384 102 L 391 121 L 410 128 L 391 135 L 384 154 L 377 135 L 358 128 L 377 121 Z"
        fill="#FEF08A"/>
</svg>
